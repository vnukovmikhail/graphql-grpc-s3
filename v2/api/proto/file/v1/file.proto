syntax = "proto3";

package file.v1;

option go_package = "github.com/vnukovmikhail/graphql-grpc-s3/v2/pkg/pb/file/v1;filev1";

service FileService {
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);
  rpc DownloadFile(FileDownloadRequest) returns (stream FileDownloadResponse);
}

message FileMetadata {
  string filename = 1;
  string mime_type = 2;
}

message UploadFileRequest {
  oneof data {
    FileMetadata metadata = 1;
    bytes chunk_data = 2;
  }
}

message UploadFileResponse {
  string file_id = 1;
  bool success = 2;
  string message = 3;
  int64 bytes_uploaded = 4;
}

message FileDownloadRequest {
  string file_id = 1;
}

message FileDownloadResponse {
  bytes chunk_data = 1;
}
